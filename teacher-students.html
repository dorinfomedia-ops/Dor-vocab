<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>Teacher OS | התלמידים שלי</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{--bg:#0d0d1a;--card:#161628;--card2:#1e1e35;--accent:#7c3aed;--accent2:#a78bfa;--text:#f8fafc;--muted:#9a9ab5;--border:#2a2a45;--green:#10b981;--red:#ef4444}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#2c1756 0,#171125 28%,var(--bg) 60%);color:var(--text);min-height:100vh;min-height:100dvh;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
    .shell{max-width:460px;margin:0 auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .back{color:var(--accent2);background:none;border:none;font-size:14px;cursor:pointer;padding:6px 0}
    h1{font-size:21px}
    .card{background:rgba(22,22,40,.95);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
    .add-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:15px;font-weight:750;cursor:pointer;background:linear-gradient(135deg,var(--accent),#5b21b6);color:#fff;font-size:15px;margin-bottom:16px}
    .add-btn:active{transform:scale(.985)}
    .empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px;line-height:1.7}
    .student{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:.15s}
    .student:active{transform:scale(.985)}
    .avatar{width:40px;height:40px;border-radius:12px;background:#282042;display:grid;place-items:center;font-size:18px;flex:none}
    .info{min-width:0;flex:1}
    .name{font-size:14.5px;font-weight:650}
    .meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
    .dot{width:7px;height:7px;border-radius:50%}
    .arrow{color:var(--muted);font-size:18px}
    .loading{text-align:center;color:var(--muted);font-size:14px;padding:30px 0}
    .quota{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <button class="back" onclick="window.location.href='./teacher-dashboard.html'">→ חזרה</button>
      <h1>התלמידים שלי</h1>
      <span style="width:52px"></span>
    </div>

    <div class="card">
      <button class="add-btn" onclick="window.location.href='./teacher-add-student.html'">➕ הוסף תלמיד</button>
      <div id="list-area"><div class="loading">טוען תלמידים...</div></div>
      <div class="quota" id="quota-line"></div>
    </div>
  </main>

  <script type="module">
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { auth, db, REDIRECTS } from "./firebase-config.js";
    import { requireRole } from "./auth-shared.js";

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = REDIRECTS.login; return; }
      let profile;
      try {
        profile = await requireRole(user, ['teacher']);
      } catch (e) {
        window.location.href = REDIRECTS.login;
        return;
      }

      const max = (profile.maxStudents === null || profile.maxStudents === undefined) ? '∞' : profile.maxStudents;
      document.getElementById('quota-line').textContent = `${profile.currentStudents ?? 0} מתוך ${max} תלמידים בתוכנית ${profile.plan || 'starter'}`;

      try {
        // חשוב: ה-where כאן הוא לא רק נוחות - הוא נדרש כדי ש-firestore.rules יאשרו את השאילתה
        const q = query(collection(db, 'users'), where('teacherId', '==', user.uid), where('role', '==', 'student'));
        const snap = await getDocs(q);
        const listArea = document.getElementById('list-area');

        if (snap.empty) {
          listArea.innerHTML = '<div class="empty">עוד אין לך תלמידים.<br>לחץ על "הוסף תלמיד" כדי להתחיל.</div>';
          return;
        }

        const students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        students.sort((a, b) => (a.displayName || '').localeCompare(b.displayName || '', 'he'));

        listArea.innerHTML = students.map(s => `
          <div class="student" onclick="window.location.href='./teacher-student-detail.html?student=${s.id}'">
            <div class="avatar">🎓</div>
            <div class="info">
              <div class="name">${escapeHtml(s.displayName || s.username)}</div>
              <div class="meta"><span class="dot" style="background:${s.active === false ? 'var(--red)' : 'var(--green)'}"></span>${s.active === false ? 'לא פעיל' : 'פעיל'} · ${escapeHtml(s.username || '')}</div>
            </div>
            <div class="arrow">‹</div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('list-area').innerHTML = '<div class="empty">לא ניתן היה לטעון את רשימת התלמידים.</div>';
      }
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
</body>
</html>
