<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>Teacher OS | אזור מנהל</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{--bg:#0d0d1a;--card:#161628;--card2:#1e1e35;--accent:#7c3aed;--accent2:#a78bfa;--text:#f8fafc;--muted:#9a9ab5;--border:#2a2a45}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#2c1756 0,#171125 28%,var(--bg) 60%);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
    .shell{width:100%;max-width:430px;text-align:center}
    .logo{width:66px;height:66px;margin:0 auto 18px;border-radius:21px;background:linear-gradient(135deg,var(--accent),#4f46e5);display:grid;place-items:center;font-size:31px;box-shadow:0 18px 50px rgba(124,58,237,.35)}
    .card{background:rgba(22,22,40,.95);border:1px solid var(--border);border-radius:24px;padding:28px 22px;box-shadow:0 25px 70px rgba(0,0,0,.32);backdrop-filter:blur(16px)}
    h1{font-size:22px;margin-bottom:8px}
    .sub{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:22px}
    .badge{display:inline-flex;align-items:center;gap:6px;background:#211a36;border:1px solid var(--border);padding:6px 12px;border-radius:999px;color:var(--accent2);font-size:12px;margin-bottom:18px}
    .btn{width:100%;border:none;border-radius:13px;padding:14px 16px;font-weight:750;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--text);font-size:15px}
    .btn:active{transform:scale(.985)}
    .loading{color:var(--muted);font-size:14px}
  </style>
</head>
<body>
  <main class="shell">
    <div class="logo" aria-hidden="true">✦</div>
    <div class="card">
      <div id="loading" class="loading">בודק הרשאות...</div>
      <div id="content" style="display:none">
        <div class="badge">🛡️ אזור מנהל מערכת</div>
        <h1 id="welcome">ברוך הבא</h1>
        <div class="sub">מסכי ניהול מורים (יצירה, הפעלה/השבתה, תוכניות ומכסות) עוד לא נבנו. השלב הזה כלל רק את תשתית ההרשאות.</div>
        <button class="btn" id="logout-btn">התנתקות</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { auth, REDIRECTS } from "./firebase-config.js";
    import { requireRole } from "./auth-shared.js";

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = REDIRECTS.login; return; }
      try {
        const profile = await requireRole(user, ['admin']);
        document.getElementById('welcome').textContent = `ברוך הבא, ${profile.displayName || ''}`;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (e) {
        window.location.href = REDIRECTS.login;
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = REDIRECTS.login;
    });
  </script>
</body>
</html>
