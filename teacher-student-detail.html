<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>Teacher OS | פרטי תלמיד</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{--bg:#0d0d1a;--card:#161628;--card2:#1e1e35;--accent:#7c3aed;--accent2:#a78bfa;--text:#f8fafc;--muted:#9a9ab5;--border:#2a2a45;--green:#10b981;--yellow:#f59e0b;--red:#ef4444}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#2c1756 0,#171125 28%,var(--bg) 60%);color:var(--text);min-height:100vh;min-height:100dvh;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
    .shell{max-width:460px;margin:0 auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .back{color:var(--accent2);background:none;border:none;font-size:14px;cursor:pointer;padding:6px 0}
    h1{font-size:19px}
    .card{background:rgba(22,22,40,.95);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.28);margin-bottom:14px}
    .head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
    .avatar{width:48px;height:48px;border-radius:14px;background:#282042;display:grid;place-items:center;font-size:22px;flex:none}
    .name{font-size:18px;font-weight:750}
    .username{font-size:12.5px;color:var(--muted);margin-top:2px;direction:ltr;text-align:right}
    .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;border-radius:999px;padding:4px 10px;margin-top:8px}
    .badge.active{background:#082c22;color:var(--green);border:1px solid #145e49}
    .badge.inactive{background:#2b1116;color:#fecdd3;border:1px solid #6f2430}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
    .stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
    .balance-card{background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(79,70,229,.1));border:1px solid var(--accent2)}
    .balance-num{font-size:34px;font-weight:800;text-align:center;margin:4px 0 2px}
    .balance-num.low{color:var(--yellow)}.balance-num.empty{color:var(--red)}
    .balance-label{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:14px}
    .btn-row{display:flex;gap:8px}
    .btn-row .btn{flex:1;margin-bottom:0}
    .section-title{font-size:13px;font-weight:650;margin-bottom:10px;color:var(--accent2)}
    .wrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;gap:8px}
    .wrow:last-child{border:none}
    .wen{font-weight:600;direction:ltr;flex:1}.whe{color:var(--muted);flex:1;text-align:right}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .del-btn{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:2px 6px;flex-shrink:0}
    .empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0}
    .loading{text-align:center;color:var(--muted);font-size:14px;padding:40px 0}
    label{display:block;font-size:12px;color:var(--muted);margin:0 3px 7px}
    input[type=text],input[type=number],input[type=date]{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:13px;padding:13px 14px;color:var(--text);font-size:15px;outline:none;margin-bottom:11px}
    input:focus{border-color:var(--accent2)}
    .btn{width:100%;border:none;border-radius:13px;padding:13px 16px;font-weight:750;cursor:pointer;font-size:14.5px}
    .btn:active{transform:scale(.985)}.btn:disabled{opacity:.55;cursor:wait}
    .primary{background:linear-gradient(135deg,var(--accent),#5b21b6);color:#fff}
    .outline{background:transparent;border:1px solid var(--border);color:var(--text)}
    .msg{display:none;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:10px}
    .msg.show{display:block}.msg.error{background:#2b1116;border:1px solid #6f2430;color:#fecdd3}.msg.success{background:#082c22;border:1px solid #145e49;color:#a7f3d0}
    .inline-form{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
    .inline-form.show{display:block}
    .status-pill{font-size:10.5px;border-radius:999px;padding:2px 8px}
    .status-completed{background:#082c22;color:var(--green)}
    .status-scheduled{background:#211a36;color:var(--accent2)}
    .status-cancelled{background:#2b1116;color:#fecdd3}
    .toggle-link{color:var(--accent2);background:none;border:none;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <button class="back" onclick="window.location.href='./teacher-students.html'">→ חזרה</button>
      <h1>פרטי תלמיד</h1>
      <span style="width:52px"></span>
    </div>

    <div id="loading" class="loading">טוען נתונים...</div>
    <div id="content" style="display:none">
      <div class="card">
        <div class="head">
          <div class="avatar">🎓</div>
          <div>
            <div class="name" id="s-name"></div>
            <div class="username" id="s-username"></div>
          </div>
        </div>
        <span class="badge" id="s-badge"></span>
      </div>

      <!-- יתרת שיעורים ותשלומים -->
      <div class="card balance-card">
        <div class="section-title">💳 יתרת שיעורים</div>
        <div class="balance-num" id="balance-num">—</div>
        <div class="balance-label" id="balance-label">שיעורים נותרו</div>
        <div class="btn-row">
          <button class="btn outline" id="toggle-log-lesson">📝 תעד שיעור</button>
          <button class="btn outline" id="toggle-add-payment">➕ הוסף חבילה</button>
        </div>

        <div class="inline-form" id="log-lesson-form">
          <label for="lesson-date">תאריך השיעור</label>
          <input type="date" id="lesson-date" />
          <label for="lesson-duration">משך (דקות)</label>
          <input type="number" id="lesson-duration" value="45" />
          <label for="lesson-notes">הערות (אופציונלי)</label>
          <input type="text" id="lesson-notes" placeholder="מה עבדנו עליו היום" />
          <button class="btn primary" id="submit-lesson">שמור שיעור</button>
          <div class="msg" id="lesson-msg"></div>
        </div>

        <div class="inline-form" id="add-payment-form">
          <label for="payment-date">תאריך התשלום</label>
          <input type="date" id="payment-date" />
          <label for="payment-lessons">כמה שיעורים בחבילה</label>
          <input type="number" id="payment-lessons" value="5" />
          <label for="payment-amount">סכום ששולם (₪)</label>
          <input type="number" id="payment-amount" placeholder="500" />
          <label for="payment-note">הערה (אופציונלי)</label>
          <input type="text" id="payment-note" placeholder="ביט / מזומן / העברה" />
          <button class="btn primary" id="submit-payment">שמור תשלום</button>
          <div class="msg" id="payment-msg"></div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">🗓️ שיעורים אחרונים</div>
        <div id="lessons-area"><div class="empty">עוד אין שיעורים מתועדים</div></div>
      </div>

      <div class="card">
        <div class="section-title">💰 תשלומים אחרונים</div>
        <div id="payments-area"><div class="empty">עוד אין תשלומים מתועדים</div></div>
      </div>

      <div class="card">
        <div class="stats">
          <div class="stat"><b id="st-words">0</b><span>מילים</span></div>
          <div class="stat"><b id="st-sessions">0</b><span>סשני תרגול</span></div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">חוזק מילים</div>
        <div id="strength-area"><div class="empty">אין עדיין נתוני תרגול</div></div>
      </div>

      <div class="card">
        <div class="section-title">➕ הוסף מילה מרחוק</div>
        <label for="new-en">אנגלית</label>
        <input type="text" id="new-en" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="apple" />
        <label for="new-he">עברית</label>
        <input type="text" id="new-he" autocomplete="off" placeholder="תפוח" />
        <button class="btn primary" id="add-word-btn">הוסף למאגר של התלמיד</button>
        <div class="msg" id="add-msg"></div>
      </div>

      <div class="card">
        <div class="section-title">מאגר המילים של התלמיד</div>
        <div id="words-area"><div class="empty">טוען...</div></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc, setDoc, deleteDoc, collection, getDocs, addDoc, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { auth, db, REDIRECTS } from "./firebase-config.js";
    import { requireRole, setBusy } from "./auth-shared.js";

    const studentId = new URLSearchParams(window.location.search).get('student');
    let currentWords = [];
    let currentUserUid = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = REDIRECTS.login; return; }
      let profile;
      try { profile = await requireRole(user, ['teacher', 'admin']); }
      catch (e) { window.location.href = REDIRECTS.login; return; }
      currentUserUid = user.uid;

      if (!studentId) { document.getElementById('loading').textContent = 'לא צוין תלמיד.'; return; }

      try {
        const studentSnap = await getDoc(doc(db, 'users', studentId));
        if (!studentSnap.exists() || studentSnap.data().role !== 'student') {
          document.getElementById('loading').textContent = 'התלמיד לא נמצא.';
          return;
        }
        const student = studentSnap.data();
        document.getElementById('s-name').textContent = student.displayName || student.username;
        document.getElementById('s-username').textContent = student.username || '';
        const badge = document.getElementById('s-badge');
        const isActive = student.active !== false;
        badge.textContent = isActive ? '● פעיל' : '● לא פעיל';
        badge.className = 'badge ' + (isActive ? 'active' : 'inactive');

        document.getElementById('lesson-date').valueAsDate = new Date();
        document.getElementById('payment-date').valueAsDate = new Date();

        await loadAll();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (e) {
        document.getElementById('loading').textContent = 'לא ניתן היה לטעון את נתוני התלמיד. ' + (e?.message || '');
      }
    });

    async function loadAll() {
      // מילים/סשנים/חוזק - הפונקציונליות המקורית שכבר עבדה, לא תלויה בהרשאות החדשות
      const [wordsSnap, sessionsSnap, strengthSnap] = await Promise.all([
        getDocs(collection(db, 'users', studentId, 'words')),
        getDocs(query(collection(db, 'users', studentId, 'sessions'), orderBy('timestamp', 'desc'), limit(5))),
        getDocs(collection(db, 'users', studentId, 'strength'))
      ]);

      // שיעורים/תשלומים - אוספים חדשים שעלולים להיכשל עד שfirestore.rules יעודכן.
      // נכשלים "בשקט" כדי לא להפיל את שאר העמוד.
      let lessonsSnap = { docs: [], empty: true };
      let paymentsSnap = { docs: [], empty: true };
      try {
        lessonsSnap = await getDocs(query(collection(db, 'lessons'), where('studentId', '==', studentId), where('teacherId', '==', currentUserUid), orderBy('createdAt', 'desc'), limit(10)));
      } catch (e) {
        document.getElementById('lessons-area').innerHTML = '<div class="empty">אין עדיין הרשאה לטעון שיעורים (firestore.rules)</div>';
      }
      try {
        paymentsSnap = await getDocs(query(collection(db, 'payments'), where('studentId', '==', studentId), where('teacherId', '==', currentUserUid), orderBy('createdAt', 'desc'), limit(10)));
      } catch (e) {
        document.getElementById('payments-area').innerHTML = '<div class="empty">אין עדיין הרשאה לטעון תשלומים (firestore.rules)</div>';
      }

      currentWords = wordsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      document.getElementById('st-words').textContent = currentWords.length;
      document.getElementById('st-sessions').textContent = sessionsSnap.size;

      const strengthMap = {};
      strengthSnap.forEach(d => { strengthMap[d.id] = d.data().strength; });

      if (currentWords.length) {
        const weak = currentWords.filter(w => strengthMap[safeId(w.en)] === 0).length;
        const mid = currentWords.filter(w => (strengthMap[safeId(w.en)] ?? 1) === 1).length;
        const strong = currentWords.filter(w => strengthMap[safeId(w.en)] === 2).length;
        document.getElementById('strength-area').innerHTML = `
          <div class="wrow"><span><span class="dot" style="background:var(--red)"></span> חלש</span><span>${weak}</span></div>
          <div class="wrow"><span><span class="dot" style="background:var(--yellow)"></span> בינוני</span><span>${mid}</span></div>
          <div class="wrow"><span><span class="dot" style="background:var(--green)"></span> חזק</span><span>${strong}</span></div>
        `;
      } else {
        document.getElementById('strength-area').innerHTML = '<div class="empty">אין עדיין נתוני תרגול</div>';
      }

      renderWords();

      const totalPaidLessons = paymentsSnap.docs.reduce((sum, d) => sum + (d.data().lessonsAdded || 0), 0);
      const usedLessons = lessonsSnap.docs.filter(d => d.data().status !== 'cancelled').length;
      const balance = totalPaidLessons - usedLessons;
      const balanceEl = document.getElementById('balance-num');
      balanceEl.textContent = balance;
      balanceEl.className = 'balance-num' + (balance <= 0 ? ' empty' : balance <= 2 ? ' low' : '');

      if (!lessonsSnap.empty) {
        document.getElementById('lessons-area').innerHTML = lessonsSnap.docs.map(d => {
          const l = d.data();
          const statusLabel = { completed: 'הושלם', scheduled: 'מתוכנן', cancelled: 'בוטל' }[l.status] || l.status;
          return `<div class="wrow">
            <span>שיעור #${l.lessonNumber ?? '—'} · ${escapeHtml(l.date || '')}</span>
            <span class="status-pill status-${l.status}">${statusLabel}</span>
          </div>`;
        }).join('');
      }

      if (!paymentsSnap.empty) {
        document.getElementById('payments-area').innerHTML = paymentsSnap.docs.map(d => {
          const p = d.data();
          return `<div class="wrow">
            <span>${escapeHtml(p.date || '')} · ${p.lessonsAdded} שיעורים</span>
            <span>${p.amountPaid ? '₪' + p.amountPaid : '—'}</span>
          </div>`;
        }).join('');
      }
    }

    function renderWords() {
      const area = document.getElementById('words-area');
      if (!currentWords.length) { area.innerHTML = '<div class="empty">עוד אין מילים במאגר של התלמיד</div>'; return; }
      area.innerHTML = currentWords.map(w => `
        <div class="wrow">
          <span class="wen">${escapeHtml(w.en)}</span>
          <span class="whe">${escapeHtml(w.he)}</span>
          <button class="del-btn" data-id="${escapeHtml(w.id)}" title="מחק">🗑</button>
        </div>
      `).join('');
      area.querySelectorAll('.del-btn').forEach(btn => btn.addEventListener('click', () => removeWord(btn.dataset.id)));
    }

    document.getElementById('add-word-btn').addEventListener('click', async () => {
      const btn = document.getElementById('add-word-btn');
      const en = document.getElementById('new-en').value.trim();
      const he = document.getElementById('new-he').value.trim();
      if (!en || !he) { showMsg('add-msg', 'יש למלא גם אנגלית וגם עברית.', 'error'); return; }
      if (currentWords.find(w => w.en.toLowerCase() === en.toLowerCase())) { showMsg('add-msg', 'המילה כבר קיימת אצל התלמיד.', 'error'); return; }
      try {
        setBusy(btn, true, 'מוסיף...');
        const id = en.replace(/[^a-zA-Z0-9]/g, '_').slice(0, 80) + '_' + Date.now();
        await setDoc(doc(db, 'users', studentId, 'words', id), { en, he });
        document.getElementById('new-en').value = '';
        document.getElementById('new-he').value = '';
        showMsg('add-msg', '✅ נוסף למאגר של התלמיד.', 'success');
        await loadAll();
      } catch (e) {
        showMsg('add-msg', 'שגיאה בהוספה: ' + (e?.message || 'נסה שוב.'), 'error');
      } finally {
        setBusy(btn, false);
      }
    });

    async function removeWord(id) {
      const word = currentWords.find(w => w.id === id);
      if (!confirm(`למחוק את "${word?.en}" מהמאגר של התלמיד?`)) return;
      try {
        await deleteDoc(doc(db, 'users', studentId, 'words', id));
        await loadAll();
      } catch (e) {
        alert('שגיאה במחיקה: ' + (e?.message || 'נסה שוב.'));
      }
    }

    document.getElementById('toggle-log-lesson').addEventListener('click', () => {
      document.getElementById('log-lesson-form').classList.toggle('show');
      document.getElementById('add-payment-form').classList.remove('show');
    });
    document.getElementById('toggle-add-payment').addEventListener('click', () => {
      document.getElementById('add-payment-form').classList.toggle('show');
      document.getElementById('log-lesson-form').classList.remove('show');
    });

    document.getElementById('submit-lesson').addEventListener('click', async () => {
      const btn = document.getElementById('submit-lesson');
      const date = document.getElementById('lesson-date').value;
      const duration = parseInt(document.getElementById('lesson-duration').value, 10) || 45;
      const notes = document.getElementById('lesson-notes').value.trim();
      if (!date) { showMsg('lesson-msg', 'יש לבחור תאריך.', 'error'); return; }

      try {
        setBusy(btn, true, 'שומר...');
        const existingLessonsSnap = await getDocs(query(collection(db, 'lessons'), where('studentId', '==', studentId), where('teacherId', '==', currentUserUid)));
        const lessonNumber = existingLessonsSnap.size + 1;
        await addDoc(collection(db, 'lessons'), {
          teacherId: currentUserUid,
          studentId,
          lessonNumber,
          date,
          durationMinutes: duration,
          notes,
          status: 'completed',
          createdAt: new Date().toISOString()
        });
        document.getElementById('lesson-notes').value = '';
        document.getElementById('log-lesson-form').classList.remove('show');
        showMsg('lesson-msg', '✅ השיעור תועד.', 'success');
        await loadAll();
      } catch (e) {
        showMsg('lesson-msg', 'שגיאה: ' + (e?.message || 'נסה שוב. ייתכן שחסרות הרשאות ב-firestore.rules.'), 'error');
      } finally {
        setBusy(btn, false);
      }
    });

    document.getElementById('submit-payment').addEventListener('click', async () => {
      const btn = document.getElementById('submit-payment');
      const date = document.getElementById('payment-date').value;
      const lessonsAdded = parseInt(document.getElementById('payment-lessons').value, 10);
      const amountPaid = parseFloat(document.getElementById('payment-amount').value) || null;
      const note = document.getElementById('payment-note').value.trim();
      if (!date || !lessonsAdded) { showMsg('payment-msg', 'יש למלא תאריך ומספר שיעורים.', 'error'); return; }

      try {
        setBusy(btn, true, 'שומר...');
        await addDoc(collection(db, 'payments'), {
          teacherId: currentUserUid,
          studentId,
          date,
          lessonsAdded,
          amountPaid,
          currency: 'ILS',
          note,
          createdAt: new Date().toISOString()
        });
        document.getElementById('payment-amount').value = '';
        document.getElementById('payment-note').value = '';
        document.getElementById('add-payment-form').classList.remove('show');
        showMsg('payment-msg', '✅ התשלום נוסף.', 'success');
        await loadAll();
      } catch (e) {
        showMsg('payment-msg', 'שגיאה: ' + (e?.message || 'נסה שוב. ייתכן שחסרות הרשאות ב-firestore.rules.'), 'error');
      } finally {
        setBusy(btn, false);
      }
    });

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text; el.className = `msg show ${type}`;
      setTimeout(() => el.className = 'msg', 3500);
    }

    function safeId(en) { return String(en).replace(/[^a-zA-Z0-9]/g, '_').slice(0, 50); }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  </script>
</body>
</html>
