<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8F4" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Teacher OS | אזור מורה</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{--bg:#F7F8F4;--card:#FFFFFF;--card2:#F3F5F2;--accent:#287D8E;--accent2:#24556A;--text:#263746;--muted:#5C6B76;--border:#E3E8E5}
    body{font-family:'Rubik',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom));font-weight:500;line-height:1.6}
    .shell{width:100%;max-width:430px;text-align:center}
    .logo{width:66px;height:66px;margin:0 auto 18px;border-radius:21px;background:linear-gradient(135deg,var(--accent),#24556A);display:grid;place-items:center;font-size:31px;box-shadow:0 8px 20px rgba(40,125,142,.25)}
    .card{background:#FFFFFF;border:1px solid var(--border);border-radius:24px;padding:28px 22px;box-shadow:0 4px 20px rgba(38,55,70,.08)}
    h1{font-size:22px;margin-bottom:8px}
    .sub{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:18px}
    .badge{display:inline-flex;align-items:center;gap:6px;background:#E8F3F5;border:1px solid var(--border);padding:6px 12px;border-radius:999px;color:var(--accent2);font-size:12px;margin-bottom:18px}
    .stats{display:flex;gap:10px;margin-bottom:20px}
    .stat{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px 10px}
    .stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
    .btn{width:100%;border:none;border-radius:13px;padding:14px 16px;font-weight:750;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--text);font-size:15px}
    .btn:active{transform:scale(.985)}
    .loading{color:var(--muted);font-size:14px}
  </style>
</head>
<body>
  <main class="shell">
    <div class="logo" aria-hidden="true">✦</div>
    <div class="card">
      <div id="loading" class="loading">בודק הרשאות...</div>
      <div id="content" style="display:none">
        <div class="badge">👩‍🏫 אזור מורה</div>
        <h1 id="welcome">ברוך הבא</h1>
        <div class="sub">דשבורד המורה נמצא בבנייה. בשלב הבא כאן תוכל לנהל תלמידים וליצור חדשים.</div>
        <div class="stats">
          <div class="stat"><b id="plan-val">—</b><span>תוכנית</span></div>
          <div class="stat"><b id="students-val">—</b><span>תלמידים</span></div>
        </div>
        <button class="btn" style="background:linear-gradient(135deg,var(--accent),#24556A);border:none;color:#fff" onclick="window.location.href='./teacher-students.html'">🎓 התלמידים שלי</button>
        <button class="btn" id="logout-btn">התנתקות</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { auth, REDIRECTS } from "./firebase-config.js";
    import { requireRole } from "./auth-shared.js";

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = REDIRECTS.login; return; }
      try {
        const profile = await requireRole(user, ['teacher']);
        document.getElementById('welcome').textContent = `ברוך הבא, ${profile.displayName || profile.firstName || ''}`;
        document.getElementById('plan-val').textContent = profile.plan || 'starter';
        const max = (profile.maxStudents === null || profile.maxStudents === undefined) ? '∞' : profile.maxStudents;
        document.getElementById('students-val').textContent = `${profile.currentStudents ?? 0} / ${max}`;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (e) {
        window.location.href = REDIRECTS.login;
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = REDIRECTS.login;
    });
  </script>
</body>
</html>
